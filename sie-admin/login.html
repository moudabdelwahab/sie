<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>تسجيل الدخول — SIE</title>

<!-- Inline SVG favicon: replaces /assets/images/logo.png, which lives
     in the platform repo and 404s from this origin. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366F1'/%3E%3Cstop offset='1' stop-color='%234338CA'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='26' fill='url(%23g)'/%3E%3Ccircle cx='50' cy='54' r='22' fill='none' stroke='white' stroke-width='7'/%3E%3Ccircle cx='50' cy='24' r='6' fill='white'/%3E%3C/svg%3E">

<script src="./theme-toggle.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./design-system.css">
<link rel="stylesheet" href="./sie-admin.css">
</head>
<body class="sie-auth-body">

<button type="button" class="icon-btn icon-btn--bordered auth-theme-btn"
        onclick="toggleSieAdminTheme()" aria-label="تبديل الوضع الليلي">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/>
    </svg>
</button>

<main class="auth-wrap">
    <form class="auth-card" id="loginForm" novalidate>
        <div class="auth-brand">
            <div class="auth-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor"
                     stroke-width="1.9" stroke-linecap="round">
                    <circle cx="12" cy="12.5" r="6.5"/><circle cx="12" cy="3.6" r="1.6"/>
                </svg>
            </div>
            <div>
                <h1>محرك الدعم الذكي</h1>
                <p class="auth-sub">لوحة تحكم SIE</p>
            </div>
        </div>

        <p class="auth-note">
            الدخول بنفس بيانات حسابك على منصة مدعوم — مفيش حساب منفصل لـ SIE.
        </p>

        <div id="authAlert" class="auth-alert" role="alert" hidden></div>

        <label class="field">
            <span>البريد الإلكتروني</span>
            <input type="email" class="input" id="email" name="email" autocomplete="username"
                   inputmode="email" dir="ltr" required placeholder="you@company.com">
        </label>

        <label class="field">
            <span>كلمة المرور</span>
            <span class="pw-wrap">
                <input type="password" class="input" id="password" name="password"
                       autocomplete="current-password" dir="ltr" required placeholder="••••••••">
                <button type="button" class="pw-toggle" id="pwToggle"
                        aria-label="إظهار كلمة المرور">إظهار</button>
            </span>
        </label>

        <button type="submit" class="btn btn--primary btn--lg" id="submitBtn">
            <span class="btn-label">تسجيل الدخول</span>
            <span class="spinner" hidden aria-hidden="true"></span>
        </button>

        <p class="auth-foot">
            الوصول للوحة دي مقصور على فريق العمل.
        </p>
    </form>
</main>

<script type="module" src="./login.js?v=redesign-1"></script>
</body>
</html>
