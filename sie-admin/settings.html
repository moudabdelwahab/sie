<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إعدادات محرك الدعم الذكي</title>
<link rel="icon" type="image/png" href="/assets/images/logo.png">
<link rel="stylesheet" href="/styles.css">
<script src="/theme-manager.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./sie-admin.css">
</head>
<body>

<div id="appRoot" class="app-loading">جارِ التحقق من الصلاحيات…</div>

<template id="pageTemplate">
  <header class="topbar">
    <div class="topbar-brand">
      <span class="eyebrow"><span class="dot"></span> محرك الدعم الذكي</span>
      <h1>الإعدادات</h1>
    </div>
    <div class="topbar-actions">
      <span class="who" id="whoAmI"></span>
      <a class="btn-ghost" href="/admin-dashboard.html">لوحة مدعوم</a>
      <button class="btn-ghost" id="signOutBtn">خروج</button>
    </div>
  </header>

  <nav class="tabs" id="mainTabs">
    <button class="tab-btn active" data-target="tab-general">التشغيل</button>
    <button class="tab-btn" data-target="tab-scenarios">الحالات اللي بيفهمها</button>
    <button class="tab-btn" data-target="tab-users">مين مسموح له</button>
  </nav>

  <!-- ══════════════ التشغيل ══════════════ -->
  <section class="tab-panel active" id="tab-general">
    <div class="live-banner" id="liveBanner"></div>

    <p class="hint big">
      أي تغيير هنا بيتحفظ فورًا وبيسري على المحادثات الجديدة على طول —
      مش محتاج تعمل حاجة تانية.
    </p>

    <div class="switch-list" id="switchList"></div>

    <div class="card">
      <h2>جرّب قبل ما تعتمد</h2>
      <p class="hint">اكتب رسالة زي ما العميل هيكتبها، وشوف المحرك هيفهمها إزاي. التجربة دي مابتأثرش على أي محادثة حقيقية ومابتستهلكش رصيد.</p>
      <div class="try-row">
        <input type="text" id="tryInput" placeholder="مثال: الاشتراك بتاعي منتهي">
        <button class="btn-primary" id="tryBtn">جرّب</button>
      </div>
      <div id="tryResult" class="try-result" hidden></div>
    </div>
  </section>

  <!-- ══════════════ الحالات ══════════════ -->
  <section class="tab-panel" id="tab-scenarios">
    <div class="stat-row" id="scenarioStats"></div>

    <div class="toolbar">
      <input type="search" id="scenarioSearch" placeholder="دوّر باسم الحالة أو بكلمة فيها…">
      <select id="scenarioCategory"><option value="">كل الأقسام</option></select>
      <select id="scenarioResolution">
        <option value="">الكل</option>
        <option value="auto">بيرد بحل جاهز</option>
        <option value="manual">بيجمع معلومات ويسلّم</option>
      </select>
      <button class="btn-primary" id="newScenarioBtn">+ حالة جديدة</button>
    </div>

    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr><th>الحالة</th><th>القسم</th><th>بيعرفها من</th><th>بيعمل إيه</th><th></th></tr>
        </thead>
        <tbody id="scenarioRows"></tbody>
      </table>
      <p class="empty" id="scenarioEmpty" hidden>مفيش حالات مطابقة.</p>
    </div>

    <details class="drafts">
      <summary>الحالات اللي إنت ضفتها <span id="draftCount" class="pill"></span></summary>
      <p class="hint">
        اللي بتضيفه بيتحفظ كمسودة الأول عشان تراجعه. عشان المحرك يبدأ يستخدمه فعلًا،
        اضغط «فعّلها» — وساعتها لازم يكون خيار «استخدم الحالات اللي ضفتها» مفتوح من صفحة التشغيل.
      </p>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>الحالة</th><th>النسخة</th><th>الحالة دلوقتي</th><th>ملاحظة</th><th></th></tr></thead>
          <tbody id="draftRows"></tbody>
        </table>
      </div>
    </details>
  </section>

  <!-- ══════════════ المستخدمون ══════════════ -->
  <section class="tab-panel" id="tab-users">
    <div class="stat-row" id="userStats"></div>
    <div class="toolbar">
      <input type="search" id="userSearch" placeholder="دوّر بالاسم أو البريد…">
      <select id="userFilter">
        <option value="">الكل</option>
        <option value="enabled">مسموح لهم</option>
        <option value="disabled">مش مسموح</option>
      </select>
    </div>
    <div id="usersNotice" class="notice" hidden></div>
    <div class="table-wrap">
      <table class="data-table">
        <thead><tr><th>العميل</th><th>الحالة</th><th>نوع السماح</th><th>استهلك</th><th></th></tr></thead>
        <tbody id="userRows"></tbody>
      </table>
      <p class="empty" id="userEmpty" hidden>مفيش مستخدمين مطابقين.</p>
    </div>
  </section>
</template>

<template id="deniedTemplate">
  <div class="denied">
    <h2>الصفحة دي لفريق العمل بس</h2>
    <p>حسابك مالوش صلاحية على إعدادات المحرك.</p>
    <a class="btn-primary" href="/customer-dashboard.html">رجوع لمنصة مدعوم</a>
  </div>
</template>

<!-- محرر الحالة -->
<dialog id="scenarioDialog" class="dialog">
  <form method="dialog" id="scenarioForm">
    <h2 id="scenarioDialogTitle">حالة جديدة</h2>

    <label class="field"><span>اسم مختصر بالإنجليزي (للنظام)</span>
      <input type="text" id="fId" dir="ltr" required placeholder="whatsapp_not_linked">
      <small class="field-hint">حروف إنجليزي صغيرة وشرطة سفلية بدل المسافة. ده اسم داخلي العميل مش هيشوفه.</small></label>

    <label class="field"><span>الاسم اللي هيظهر لفريقك</span>
      <input type="text" id="fLabelAr" required placeholder="رقم الواتساب مش مربوط"></label>

    <label class="field"><span>القسم</span>
      <select id="fCategory">
        <option value="whatsapp">واتساب</option>
        <option value="subscription">الاشتراكات والفلوس</option>
        <option value="login">الدخول والحساب</option>
        <option value="api">الربط البرمجي</option>
        <option value="inquiry">استفسارات</option>
        <option value="other">أخرى</option>
      </select></label>

    <fieldset class="field">
      <legend>الكلمات اللي المحرك يعرف بيها الحالة دي</legend>
      <p class="hint">
        حط الكلمة الأساسية اللي لو العميل كتبها تبقى الحالة دي شبه أكيدة، وبعدين كلمات مساعدة.
        الأهمية بتنزل من فوق لتحت.
      </p>
      <div id="evidenceList"></div>
      <button type="button" class="btn-ghost" id="addEvidenceBtn">+ كلمة</button>
      <div class="confidence-preview" id="confidencePreview"></div>
    </fieldset>

    <label class="field checkbox">
      <input type="checkbox" id="fHasAuto"> <span>عندي حل جاهز يرد بيه على طول</span></label>

    <div id="autoTextWrap" hidden>
      <label class="field"><span>الرد اللي هيوصل للعميل</span>
        <textarea id="fTextAr" rows="7" placeholder="اشرح الحل خطوة خطوة بلغة بسيطة…"></textarea></label>
    </div>

    <label class="field checkbox">
      <input type="checkbox" id="fRequiresTicket" checked>
      <span>لو مااتحلّتش، افتح تذكرة لفريق الدعم</span></label>

    <label class="field"><span>ملاحظة للمراجعة (اختياري)</span>
      <input type="text" id="fNote" placeholder="ليه ضفت الحالة دي"></label>

    <div id="scenarioErrors" class="auth-alert auth-alert--error" hidden></div>

    <div class="dialog-actions">
      <button type="button" class="btn-ghost" id="cancelScenarioBtn">إلغاء</button>
      <button type="button" class="btn-primary" id="saveScenarioBtn">احفظ</button>
    </div>
  </form>
</dialog>

<!-- محرر السماح -->
<dialog id="accessDialog" class="dialog">
  <form method="dialog" id="accessForm">
    <h2>السماح باستخدام المحرك — <span id="accessUserName"></span></h2>

    <label class="field checkbox">
      <input type="checkbox" id="aEnabled"> <span>مسموح له يستخدم المحرك</span></label>

    <label class="field"><span>نوع السماح</span>
      <select id="aMode">
        <option value="unlimited">من غير حدود</option>
        <option value="quota">عدد رسائل محدد</option>
        <option value="expiration">لحد تاريخ معيّن</option>
      </select></label>

    <label class="field" id="aQuotaWrap" hidden><span>عدد الرسائل المسموح بيها</span>
      <input type="number" id="aQuota" min="1" dir="ltr"></label>

    <label class="field" id="aExpiryWrap" hidden><span>ينتهي في</span>
      <input type="datetime-local" id="aExpiry" dir="ltr"></label>

    <label class="field"><span>ملاحظات</span>
      <input type="text" id="aNotes"></label>

    <div id="accessErrors" class="auth-alert auth-alert--error" hidden></div>

    <div class="dialog-actions">
      <button type="button" class="btn-ghost" id="resetUsageBtn">صفّر العدّاد</button>
      <span class="spacer"></span>
      <button type="button" class="btn-ghost" id="cancelAccessBtn">إلغاء</button>
      <button type="button" class="btn-primary" id="saveAccessBtn">احفظ</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" hidden></div>

<script type="module" src="./settings.js"></script>
</body>
</html>
