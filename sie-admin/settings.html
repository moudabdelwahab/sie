<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إعدادات محرك الدعم الذكي (SIE)</title>
<link rel="icon" type="image/png" href="/assets/images/logo.png">
<link rel="stylesheet" href="/styles.css">
<script src="/theme-manager.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./sie-admin.css">
</head>
<body>

<div id="appRoot" class="app-loading">جارِ التحقق من الصلاحيات…</div>

<template id="pageTemplate">
  <header class="topbar">
    <div class="topbar-brand">
      <span class="eyebrow"><span class="dot"></span> محرك الدعم الذكي</span>
      <h1>الإعدادات الشاملة</h1>
    </div>
    <div class="topbar-actions">
      <span class="who" id="whoAmI"></span>
      <a class="btn-ghost" href="/admin-dashboard.html">لوحة مدعوم</a>
      <button class="btn-ghost" id="signOutBtn">تسجيل الخروج</button>
    </div>
  </header>

  <nav class="tabs" id="mainTabs">
    <button class="tab-btn active" data-target="tab-scenarios">السيناريوهات</button>
    <button class="tab-btn" data-target="tab-engine">إعدادات المحرك</button>
    <button class="tab-btn" data-target="tab-users">المستخدمون</button>
  </nav>

  <!-- ══════════════════ SCENARIOS ══════════════════ -->
  <section class="tab-panel active" id="tab-scenarios">
    <div class="stat-row" id="scenarioStats"></div>

    <div class="toolbar">
      <input type="search" id="scenarioSearch" placeholder="ابحث بالاسم أو المعرّف أو الكلمة المفتاحية…">
      <select id="scenarioCategory"><option value="">كل الأقسام</option></select>
      <select id="scenarioResolution">
        <option value="">كل الأنواع</option>
        <option value="auto">بيرد تلقائيًا</option>
        <option value="manual">بيفتح تذكرة</option>
      </select>
      <button class="btn-primary" id="newScenarioBtn">+ سيناريو جديد</button>
    </div>

    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>السيناريو</th>
            <th>القسم</th>
            <th>الأدلة</th>
            <th>النوع</th>
            <th>أسئلة</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="scenarioRows"></tbody>
      </table>
      <p class="empty" id="scenarioEmpty" hidden>مفيش سيناريوهات مطابقة للبحث.</p>
    </div>

    <details class="drafts">
      <summary>المسودات المحفوظة في قاعدة البيانات <span id="draftCount" class="pill"></span></summary>
      <p class="hint">
        التعديلات بتتحفظ كمسودة الأول ومابتأثرش على المحرك. المحرك بيقرأ النسخ
        <strong>المنشورة</strong> بس، عشان أي تعديل يتراجع قبل ما أي عميل يشوف أثره.
      </p>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>المفتاح</th><th>الإصدار</th><th>الحالة</th><th>ملاحظة</th><th></th></tr></thead>
          <tbody id="draftRows"></tbody>
        </table>
      </div>
    </details>
  </section>

  <!-- ══════════════════ ENGINE ══════════════════ -->
  <section class="tab-panel" id="tab-engine">
    <div class="card">
      <h2>عتبات القرار</h2>
      <p class="hint">
        دي القيم اللي المحرك بيقرر بيها فعلًا دلوقتي، مقروءة من
        <code class="ltr">decision-policy.js</code> مباشرة. تغييرها بيتم في الكود
        عشان أي تعديل عليها يعدّي على مراجعة — مش من شاشة.
      </p>
      <div class="kv-grid" id="policyGrid"></div>
    </div>

    <div class="card">
      <h2>طبقة اللغة</h2>
      <div class="kv-grid" id="languageGrid"></div>
    </div>

    <div class="card">
      <h2>قاعدة المعرفة</h2>
      <p class="hint">المحتوى اللي بيكمّل ردود السيناريوهات اللي ليها <code class="ltr">knowledgeSource</code>.</p>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>المفتاح</th><th>النص (عربي)</th></tr></thead>
          <tbody id="knowledgeRows"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2>تجربة المحرك</h2>
      <p class="hint">اكتب رسالة زي ما العميل هيكتبها بالظبط، وشوف المحرك بيشخّصها إزاي — من غير ما تأثر على أي محادثة حقيقية.</p>
      <div class="try-row">
        <input type="text" id="tryInput" placeholder="مثال: الاشتراك بتاعي منتهي">
        <button class="btn-primary" id="tryBtn">شخّص</button>
      </div>
      <div id="tryResult" class="try-result" hidden></div>
    </div>
  </section>

  <!-- ══════════════════ USERS ══════════════════ -->
  <section class="tab-panel" id="tab-users">
    <div class="stat-row" id="userStats"></div>

    <div class="toolbar">
      <input type="search" id="userSearch" placeholder="ابحث بالاسم أو البريد…">
      <select id="userFilter">
        <option value="">الكل</option>
        <option value="enabled">مفعّل</option>
        <option value="disabled">غير مفعّل</option>
      </select>
    </div>

    <div id="usersNotice" class="notice" hidden></div>

    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr><th>العميل</th><th>الحالة</th><th>النوع</th><th>الاستخدام</th><th></th></tr>
        </thead>
        <tbody id="userRows"></tbody>
      </table>
      <p class="empty" id="userEmpty" hidden>مفيش مستخدمين مطابقين.</p>
    </div>
  </section>
</template>

<template id="deniedTemplate">
  <div class="denied">
    <h2>الصفحة دي لفريق العمل بس</h2>
    <p>حسابك مالوش صلاحية على إعدادات المحرك.</p>
    <a class="btn-primary" href="/customer-dashboard.html">الرجوع لمنصة مدعوم</a>
  </div>
</template>

<!-- Scenario editor -->
<dialog id="scenarioDialog" class="dialog">
  <form method="dialog" id="scenarioForm">
    <h2 id="scenarioDialogTitle">سيناريو جديد</h2>

    <label class="field"><span>المعرّف (إنجليزي، بدون مسافات)</span>
      <input type="text" id="fId" dir="ltr" required placeholder="whatsapp_number_not_linked"></label>

    <div class="two-col">
      <label class="field"><span>الاسم بالعربي</span>
        <input type="text" id="fLabelAr" required placeholder="رقم الواتساب مش مربوط"></label>
      <label class="field"><span>الاسم بالإنجليزي</span>
        <input type="text" id="fLabelEn" dir="ltr" required placeholder="WhatsApp number not linked"></label>
    </div>

    <label class="field"><span>القسم</span>
      <select id="fCategory">
        <option value="whatsapp">واتساب</option>
        <option value="subscription">اشتراكات</option>
        <option value="login">تسجيل الدخول</option>
        <option value="api">API</option>
        <option value="inquiry">استعلام</option>
        <option value="other">أخرى</option>
      </select></label>

    <fieldset class="field">
      <legend>الأدلة (evidence)</legend>
      <p class="hint">
        الثقة = متوسط <em>مرجّح</em>، يعني كل دليل زيادة <strong>بيخفّف</strong> اللي اتطابق.
        خلّي الدليل المميِّز أعلى وزن، والباقي تأكيد. المؤشر تحت بيوضح هيوصل لكام.
      </p>
      <div id="evidenceList"></div>
      <button type="button" class="btn-ghost" id="addEvidenceBtn">+ دليل</button>
      <div class="confidence-preview" id="confidencePreview"></div>
    </fieldset>

    <label class="field checkbox">
      <input type="checkbox" id="fHasAuto"> <span>عنده رد تلقائي</span></label>

    <div id="autoTextWrap" hidden>
      <label class="field"><span>الرد بالعربي</span>
        <textarea id="fTextAr" rows="6" placeholder="اشرح الحل خطوة خطوة…"></textarea></label>
      <label class="field"><span>الرد بالإنجليزي</span>
        <textarea id="fTextEn" rows="6" dir="ltr"></textarea></label>
    </div>

    <label class="field checkbox">
      <input type="checkbox" id="fRequiresTicket" checked>
      <span>يفتح تذكرة لو مااتحلّش</span></label>

    <label class="field"><span>ملاحظة للمراجعة (اختياري)</span>
      <input type="text" id="fNote" placeholder="ليه ضفت/عدّلت السيناريو ده"></label>

    <div id="scenarioErrors" class="auth-alert auth-alert--error" hidden></div>

    <div class="dialog-actions">
      <button type="button" class="btn-ghost" id="cancelScenarioBtn">إلغاء</button>
      <button type="button" class="btn-primary" id="saveScenarioBtn">حفظ كمسودة</button>
    </div>
  </form>
</dialog>

<!-- Access editor -->
<dialog id="accessDialog" class="dialog">
  <form method="dialog" id="accessForm">
    <h2>صلاحية SIE — <span id="accessUserName"></span></h2>

    <label class="field checkbox">
      <input type="checkbox" id="aEnabled"> <span>مفعّل</span></label>

    <label class="field"><span>نوع الصلاحية</span>
      <select id="aMode">
        <option value="unlimited">بلا حدود</option>
        <option value="quota">عدد رسائل محدد</option>
        <option value="expiration">تاريخ انتهاء</option>
      </select></label>

    <label class="field" id="aQuotaWrap" hidden><span>عدد الرسائل</span>
      <input type="number" id="aQuota" min="1" dir="ltr"></label>

    <label class="field" id="aExpiryWrap" hidden><span>ينتهي في</span>
      <input type="datetime-local" id="aExpiry" dir="ltr"></label>

    <label class="field"><span>ملاحظات</span>
      <input type="text" id="aNotes"></label>

    <div id="accessErrors" class="auth-alert auth-alert--error" hidden></div>

    <div class="dialog-actions">
      <button type="button" class="btn-ghost" id="resetUsageBtn">تصفير الاستخدام</button>
      <span class="spacer"></span>
      <button type="button" class="btn-ghost" id="cancelAccessBtn">إلغاء</button>
      <button type="button" class="btn-primary" id="saveAccessBtn">حفظ</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" hidden></div>

<script type="module" src="./settings.js"></script>
</body>
</html>
